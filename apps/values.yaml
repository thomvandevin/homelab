# Monitoring is off while the replacement SSD's write rate is unknown: the
# previous drive wore out at ~530 GB/day. The prometheus-operator CRDs are
# still installed, so the ServiceMonitors declared by longhorn, argocd and
# postgres-exporter keep applying cleanly while the stack is disabled.
prometheus:
  enabled: false

workspace:
  gitUserName: Thom van de Vin
  # worktree gives every session started from claude.ai its own git worktree,
  # so parallel sessions in a repo cannot overwrite each other; same-dir shares
  # one checkout. Applied at the next idle-guarded restart.
  spawn: worktree
  authorizedKeys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL0dyepv7Mynvj4EqLWfM0DtAz20ZI8+AfU/qhHiAsXP thomvandevin@thomvandevin-macbook.local
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBR653yMYwe9MQkwYTR0QUQu1cFAcgzxKIGqd6iIlz1o tvandevin@LMAC-N6CFJ7CWGC
  repos:
    homelab: git@github.com:thomvandevin/homelab.git
    homelab-media: git@github.com:thomvandevin/homelab-media.git
    dialoguearr: git@github.com:thomvandevin/dialoguearr.git
    swiss-rounds: git@gitlab.com:swiss-rounds/swiss-rounds.git
    closet: git@gitlab.com:thomvandevin-projects/closet.git
    limitless-tournament-decks: git@gitlab.com:thomvandevin-projects/limitless-tournament-decks.git
    pokemon-ai: git@gitlab.com:thomvandevin-projects/pokemon-ai.git
