    rotom-ui: git@gitlab.com:thomvandevin-projects/rotom-ui.git
    scraper: git@gitlab.com:thomvandevin-projects/scraper.git
    slowpoke-bingo: git@gitlab.com:thomvandevin-projects/slowpoke-bingo.git
    thomvandev.in: git@gitlab.com:thomvandevin-projects/thomvandev.in.git
