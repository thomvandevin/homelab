# Monitoring is off while the replacement SSD's write rate is unknown: the
# previous drive wore out at ~530 GB/day. The prometheus-operator CRDs are
# still installed, so the ServiceMonitors declared by longhorn, argocd and
# postgres-exporter keep applying cleanly while the stack is disabled.
prometheus:
  enabled: false

workspace:
  gitUserName: Thom van de Vin
  # worktree gives every session started from claude.ai its own git worktree,
  # so parallel sessions in a repo cannot overwrite each other; same-dir shares
  # one checkout. Applied at the next idle-guarded restart.
  spawn: worktree
  authorizedKeys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL0dyepv7Mynvj4EqLWfM0DtAz20ZI8+AfU/qhHiAsXP thomvandevin@thomvandevin-macbook.local
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBR653yMYwe9MQkwYTR0QUQu1cFAcgzxKIGqd6iIlz1o tvandevin@LMAC-N6CFJ7CWGC
  repos:
    homelab: git@github.com:thomvandevin/homelab.git
    homelab-media: git@github.com:thomvandevin/homelab-media.git
    dialoguearr: git@github.com:thomvandevin/dialoguearr.git
    swiss-rounds: git@gitlab.com:swiss-rounds/swiss-rounds.git
    closet: git@gitlab.com:thomvandevin-projects/closet.git
    limitless-tournament-decks: git@gitlab.com:thomvandevin-projects/limitless-tournament-decks.git
    pokemon-ai: git@gitlab.com:thomvandevin-projects/pokemon-ai.git
    pokemon-api: git@gitlab.com:thomvandevin-projects/pokemon-api.git
    pokemon-bot: git@gitlab.com:thomvandevin-projects/pokemon-bot.git
    pokemon-cardmarket-extension: git@gitlab.com:thomvandevin-projects/pokemon-cardmarket-extension.git
    pokemon-index: git@gitlab.com:thomvandevin-projects/pokemon-index.git
    rotom-ui: git@gitlab.com:thomvandevin-projects/rotom-ui.git
    home-assistant: git@gitlab.com:thomvandevin-projects/home-assistant.git
    scraper: git@gitlab.com:thomvandevin-projects/scraper.git
    slowpoke-bingo: git@gitlab.com:thomvandevin-projects/slowpoke-bingo.git
    thomvandev.in: git@gitlab.com:thomvandevin-projects/thomvandev.in.git
    workspace: git@gitlab.com:thomvandevin-projects/workspace.git
  # Unattended Claude runs (cron in Europe/Amsterdam time); prompt is a file in
  # the repo, allow pre-approves commands on top of auto mode. Apply live.
  schedules:
    pokemon-bot-scrape-health:
      repo: pokemon-bot
      cron: "31 * * * *"
      prompt: monitoring/scrape-health.md
      # Claude only starts when this check's output changed, or every sweep hours
      check: monitoring/check.sh
      sweep: 6
      allow:
        - Bash(monitoring/scrape_health.sh)
        - Bash(./monitoring/scrape_health.sh)
        - Bash(monitoring/psql.sh:*)
        - Bash(./monitoring/psql.sh:*)
        - Bash(monitoring/merge_seq.sh:*)
        - Bash(./monitoring/merge_seq.sh:*)
        - Bash(monitoring/retry_delivery.sh:*)
        - Bash(./monitoring/retry_delivery.sh:*)
        - Bash(kubectl -n pokemon-bot:*)
        - Bash(glab mr:*)
        - Bash(glab api:*)
        - Bash(git push:*)
    homelab-triage:
      repo: homelab
      cron: "3-59/15 * * * *"
      prompt: monitoring/triage.md
      check: monitoring/check.sh
      sweep: 24
      allow:
        - Bash(kubectl get:*)
        - Bash(kubectl describe:*)
        - Bash(kubectl logs:*)
        - Bash(kubectl top:*)
        - Bash(gh pr:*)
        - Bash(glab api:*)
        - Bash(glab mr:*)
        - Bash(git push:*)
    home-assistant-weekly:
      repo: home-assistant
      # Hourly on Monday from 09:07 so a missed tick catches up; the check
      # changes once a week, so Claude starts once
      cron: "7 9-21 * * 1"
      prompt: monitoring/weekly-check.md
      check: 'echo "home assistant weekly check $(date +%G-W%V)"'
      sweep: 168
      allow:
        - mcp__claude_ai_home-assistant_MCP__homeassistant__GetLiveContext
        - mcp__claude_ai_home-assistant_MCP__history__get_history
        - mcp__claude_ai_home-assistant_MCP__system_health__get_system_info
        - mcp__claude_ai_home-assistant_MCP__system_log__get_entries
        - mcp__claude_ai_home-assistant_MCP__search__search
  # Included by ~/.ssh/config in the workspace; changes apply live
  sshConfig: |
    Host homelab-media
      User homelab
  # Installed in the workspace when missing (never uninstalled); the key must
  # match the name in the marketplace's own manifest
  marketplaces:
    claude-plugins-official: anthropics/claude-plugins-official
    claude-code-plugins: anthropics/claude-code
    superpowers-dev: https://github.com/obra/superpowers.git
    ponytail: DietrichGebert/ponytail
  plugins:
    - superpowers@claude-plugins-official
    - superpowers@superpowers-dev
    - ponytail@ponytail
    - atomic-agents@claude-plugins-official
    - claude-md-management@claude-plugins-official
    - cloudflare@claude-plugins-official
    - code-review@claude-plugins-official
    - code-simplifier@claude-plugins-official
    - context7@claude-plugins-official
    - feature-dev@claude-plugins-official
    - frontend-design@claude-code-plugins
    - frontend-design@claude-plugins-official
    - gitlab@claude-plugins-official
    - kotlin-lsp@claude-plugins-official
    - mcp-tunnels@claude-plugins-official
    - redis-development@claude-plugins-official
    - typescript-lsp@claude-plugins-official

# Cloudflare Access application in front of homelab-mcp.thomvandev.in; the
# server rejects any request whose Access JWT carries a different AUD
homelabMcp:
  accessTeamDomain: thomvandevin.cloudflareaccess.com
  accessAud: e6f740de94f47818ceea12be07155cbdf0c15d4865f794c85a183a2469b9af99
  # restart_deployment and argocd_sync, plus the RBAC they need
  write: true

adguard:
  # MetalLB address AdGuard's DHCP hands out as the first DNS server
  ip: 192.168.178.160
  # On: the Ziggo modem's DHCPv4 server is switched off (2026-10-31); two DHCP servers must never run together
  dhcp: true
