apiVersion: v1
kind: Namespace
metadata:
  name: matter-server
  labels:
    name: matter-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-server-data
  namespace: matter-server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
spec:
  replicas: 1
  # RWO volume plus a fixed host port means the old pod must go before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      # Matter commissioning relies on IPv6 multicast and mDNS reaching the LAN and the
      # Thread border router, which the pod network cannot carry. It also puts the
      # websocket on the node, so Home Assistant (also hostNetwork) reaches it on localhost.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Unlike the Python server this image runs unprivileged as 1000:1000, so the
      # existing root-owned volume has to be handed over
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5580
              name: ws
          env:
            - name: STORAGE_PATH
              value: /data
            # Thread devices are reached over IPv6 link-local; without a primary
            # interface the SDK picks none and every mDNS advertisement fails
            - name: PRIMARY_INTERFACE
              value: enp1s0
            # Exposes the /ble endpoint that Home Assistant's matter-ble-proxy drives, so
            # commissioning uses HA's bluetooth (an ESPHome proxy near the lamps) instead
            # of an adapter on this host. Mutually exclusive with BLUETOOTH_ADAPTER.
            - name: BLE_PROXY
              value: "true"
            - name: TZ
              value: Europe/Amsterdam
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
---
apiVersion: v1
kind: Service
metadata:
  name: matter-server
  namespace: matter-server
spec:
  type: ClusterIP
  selector:
    app: matter-server
  ports:
    - name: ws
      port: 5580
      targetPort: 5580
