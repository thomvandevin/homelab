apiVersion: v1
kind: Namespace
metadata:
  annotations:
    glance/icon: mdi:api
  name: pokemon-api
---
# -- RBAC for GitLab runner deploy step ----------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pokemon-api-deployer
  namespace: pokemon-api
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-pokemon-api-deploy
  namespace: pokemon-api
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-job
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: pokemon-api-deployer
  apiGroup: rbac.authorization.k8s.io
---
# -- Secrets -------------------------------------------------------------------
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: db-secret
  namespace: pokemon-api
data:
  password: {{ .Values.db.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: api-secret
  namespace: pokemon-api
data:
  admin-token: {{ .Values.pokemon_api.admin_token | b64enc | quote }}
  portal-secret: {{ .Values.pokemon_api.portal_secret | default "" | b64enc | quote }}
  admin-password-hash: {{ .Values.pokemon_api.admin_password_hash | default "" | b64enc | quote }}
  ptcgl-reader-password: {{ required "pokemon_api.ptcgl_reader_password is missing from secrets.yaml" .Values.pokemon_api.ptcgl_reader_password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: gitlab-registry-secret
  namespace: pokemon-api
data:
  .dockerconfigjson: {{ .Values.gitlab.registry | quote }}
---
# -- pokemon-api ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-api
  namespace: pokemon-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pokemon-api
  template:
    metadata:
      labels:
        app: pokemon-api
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      initContainers:
        - name: create-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql.db-system.svc.cluster.local -p 5432; do sleep 2; done
              PGPASSWORD=$DB_PASSWORD psql -h postgresql.db-system.svc.cluster.local -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'pokemon_api'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h postgresql.db-system.svc.cluster.local -U postgres -c "CREATE DATABASE pokemon_api"
              # pokemon-api only reads the PTCGL mirror, with its own read-only login, granted again on every start so
              # tables a mirror sync adds later stay readable. The mirror's database is created here when missing so the
              # login exists before the first sync. A failing grant must not keep the API down; the mirror is optional.
              export PGPASSWORD=$DB_PASSWORD
              PG="psql -h postgresql.db-system.svc.cluster.local -U postgres"
              $PG -tc "SELECT 1 FROM pg_database WHERE datname = 'ptcgl'" | grep -q 1 || $PG -c "CREATE DATABASE ptcgl"
              $PG -v ON_ERROR_STOP=1 -d ptcgl <<'SQL' || echo "ptcgl_reader grants failed; pokemon-api starts without them"
              \getenv pw READER_PASSWORD
              SELECT 'CREATE ROLE ptcgl_reader' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'ptcgl_reader')\gexec
              ALTER ROLE ptcgl_reader WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'pw';
              GRANT CONNECT ON DATABASE ptcgl TO ptcgl_reader;
              GRANT USAGE ON SCHEMA public TO ptcgl_reader;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO ptcgl_reader;
              ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT ON TABLES TO ptcgl_reader;
              SQL
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ptcgl-reader-password
      containers:
        - name: pokemon-api
          image: registry.gitlab.com/thomvandevin-projects/pokemon-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgresql.db-system.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pokemon_api
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: META_DB_HOST
              value: postgresql.db-system.svc.cluster.local
            - name: META_DB_PORT
              value: "5432"
            - name: META_DB_NAME
              value: limitless_tournaments_db
            - name: META_DB_USER
              value: postgres
            - name: META_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: CARD_MIRROR_OVERLAY
              value: "on"
            - name: PTCGL_DB_HOST
              value: postgresql.db-system.svc.cluster.local
            - name: PTCGL_DB_PORT
              value: "5432"
            - name: PTCGL_DB_NAME
              value: ptcgl
            - name: PTCGL_DB_USER
              value: ptcgl_reader
            - name: PTCGL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ptcgl-reader-password
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: admin-token
            - name: PORTAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: portal-secret
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: admin-password-hash
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pokemon-api
  namespace: pokemon-api
spec:
  selector:
    app: pokemon-api
  ports:
    - port: 8080
      targetPort: 8080
---
# Nightly TCGdex sync: compiles the card database and uploads it to /admin/sync/tcgdex.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pokemon-api-tcgdex-sync
  namespace: pokemon-api
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          imagePullSecrets:
            - name: gitlab-registry-secret
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: registry.gitlab.com/thomvandevin-projects/pokemon-api/tcgdex-sync:latest
              imagePullPolicy: Always
              env:
                - name: POKEMON_API_URL
                  value: http://pokemon-api.pokemon-api.svc.cluster.local:8080
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: api-secret
                      key: admin-token
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 3Gi
---
# Compendium rulings sync: recent.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pokemon-api-rulings-recent
  namespace: pokemon-api
spec:
  schedule: "10 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:latest@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: api-secret
                      key: admin-token
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  curl -fsS -X POST -H "X-Admin-Token: $ADMIN_TOKEN"
                  "http://pokemon-api.pokemon-api.svc.cluster.local:8080/admin/sync/rulings?mode=recent"
                  | grep -q '"started":true'
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
---
# Cardmarket price guide; Cardmarket publishes the file around 00:51 UTC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pokemon-api-prices
  namespace: pokemon-api
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:latest@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: api-secret
                      key: admin-token
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  curl -sS --fail-with-body --max-time 300 -X POST -H "X-Admin-Token: $ADMIN_TOKEN"
                  "http://pokemon-api.pokemon-api.svc.cluster.local:8080/admin/sync/prices"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
---
# Compendium rulings sync: full.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pokemon-api-rulings-full
  namespace: pokemon-api
spec:
  schedule: "30 4 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:latest@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: api-secret
                      key: admin-token
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  curl -fsS -X POST -H "X-Admin-Token: $ADMIN_TOKEN"
                  "http://pokemon-api.pokemon-api.svc.cluster.local:8080/admin/sync/rulings?mode=full"
                  | grep -q '"started":true'
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
