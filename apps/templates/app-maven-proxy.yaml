# Caching mirror of Maven Central and the Gradle plugin portal for CI. The GitLab
# runner points every Maven build at it (see helm-gitlab-runner.yaml), so a new
# branch or project resolves its dependencies over the cluster network instead of
# downloading them from Central again.
apiVersion: v1
kind: Namespace
metadata:
  name: maven-proxy
  labels:
    name: maven-proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reposilite-config
  namespace: maven-proxy
data:
  shared.json: |
    {
      "frontend": {
        "id": "homelab-maven-proxy",
        "title": "Homelab Maven proxy",
        "description": "Caching mirror of Maven Central and the Gradle plugin portal for CI"
      },
      "maven": {
        "repositories": [
          {
            "id": "central",
            "visibility": "PUBLIC",
            "redeployment": false,
            "preserveSnapshots": false,
            "storageProvider": {
              "type": "fs",
              "quota": "100%",
              "mount": ""
            },
            "storagePolicy": "PRIORITIZE_UPSTREAM_METADATA",
            "metadataMaxAge": 0,
            "resolutionCacheMaxEntries": 0,
            "proxied": [
              {
                "reference": "https://repo.maven.apache.org/maven2",
                "store": true,
                "allowedGroups": [],
                "blockedGroups": [],
                "allowedExtensions": [".jar", ".war", ".aar", ".pom", ".xml", ".module", ".md5", ".sha1", ".sha256", ".sha512", ".asc"],
                "connectTimeout": 5,
                "readTimeout": 60,
                "authorization": null,
                "httpProxy": "",
                "authenticatedFetchingOnly": false
              }
            ],
            "parallelMetadataLookup": false,
            "resolutionCacheLevel": "NEGATIVE_CACHING"
          },
          {
            "id": "gradle-plugins",
            "visibility": "PUBLIC",
            "redeployment": false,
            "preserveSnapshots": false,
            "storageProvider": {
              "type": "fs",
              "quota": "100%",
              "mount": ""
            },
            "storagePolicy": "PRIORITIZE_UPSTREAM_METADATA",
            "metadataMaxAge": 0,
            "resolutionCacheMaxEntries": 0,
            "proxied": [
              {
                "reference": "https://plugins.gradle.org/m2",
                "store": true,
                "allowedGroups": [],
                "blockedGroups": [],
                "allowedExtensions": [".jar", ".war", ".aar", ".pom", ".xml", ".module", ".md5", ".sha1", ".sha256", ".sha512", ".asc"],
                "connectTimeout": 5,
                "readTimeout": 60,
                "authorization": null,
                "httpProxy": "",
                "authenticatedFetchingOnly": false
              }
            ],
            "parallelMetadataLookup": false,
            "resolutionCacheLevel": "NEGATIVE_CACHING"
          }
        ]
      },
      "statistics": {
        "enabled": false,
        "resolvedRequestsInterval": "MONTHLY"
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reposilite-data
  namespace: maven-proxy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reposilite
  namespace: maven-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reposilite
  template:
    metadata:
      labels:
        app: reposilite
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      containers:
        - name: reposilite
          image: dzikoysk/reposilite:3.6.3@sha256:90de4c8e6c0e7e6aef71a4d9e8f3fabb3ac354524e0d0245a8e3fa65bc5832fc
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: REPOSILITE_OPTS
              value: --shared-configuration=/etc/reposilite/shared.json
            - name: JAVA_OPTS
              value: -Xmx256m
          readinessProbe:
            httpGet:
              path: /api/maven/details/central
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/maven/details/central
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            # the entrypoint chowns everything under /app, which fails on a read-only ConfigMap mount
            - name: config
              mountPath: /etc/reposilite
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reposilite-data
        - name: config
          configMap:
            name: reposilite-config
---
apiVersion: v1
kind: Service
metadata:
  name: maven-proxy
  namespace: maven-proxy
spec:
  type: ClusterIP
  selector:
    app: reposilite
  ports:
    - name: http
      port: 8080
      targetPort: 8080
