# Card images, set art, icons and the raw PTCGL bundles they are decoded from (bucket `cards`). The /images/ proxy
# (card-images) serves `decoded/` publicly; everything else is only reachable in the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: pokemon-api
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 35Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: pokemon-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      securityContext:
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: s3-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: s3-secret-key
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: pokemon-api
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokemon-api-storage
  namespace: pokemon-api
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - backend:
              service:
                name: rustfs
                port:
                  number: 9001
            path: "/"
            pathType: Prefix
  tls:
    - hosts:
        - pokemon-api-storage
