apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: db-secret
  namespace: db-system
data:
  password: {{ .Values.db.password | b64enc | quote }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: postgresql
    targetRevision: 16.7.27
    helm:
      valuesObject:
        primary:
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        image:
          # Broadcom pulled the versioned tags from docker.io/bitnami in Aug 2025 and
          # moved them to bitnamilegacy; only :latest remains under bitnami. The old
          # node had the image cached, so this only surfaced on a rebuild.
          repository: bitnamilegacy/postgresql
        global:
          security:
            # bitnamilegacy is not the repository the chart expects, so its image
            # verification has to be waived explicitly
            allowInsecureImages: true
          postgresql:
            auth:
              existingSecret: db-secret
              secretKeys:
                adminPasswordKey: password
  destination:
    namespace: db-system
    server: https://kubernetes.default.svc
