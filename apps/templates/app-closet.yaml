apiVersion: v1
kind: Namespace
metadata:
  annotations:
    glance/icon: mdi:hanger
  name: closet
  labels:
    name: closet
---
# -- RBAC for GitLab runner deploy step ----------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: closet-deployer
  namespace: closet
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-closet-deploy
  namespace: closet
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-job
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: closet-deployer
  apiGroup: rbac.authorization.k8s.io
---
# -- Secrets ------------------------------------------------------------------
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: db-secret
  namespace: closet
data:
  password: {{ .Values.db.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: app-secret
  namespace: closet
data:
  minio-access-key: {{ .Values.closet.minio.access_key | b64enc | quote }}
  minio-secret-key: {{ .Values.closet.minio.secret_key | b64enc | quote }}
  smtp-username: {{ .Values.closet.smtp.username | b64enc | quote }}
  smtp-password: {{ .Values.closet.smtp.password | b64enc | quote }}
  openrouter-api-key-paid: {{ .Values.closet.openrouter.api_key_paid | b64enc | quote }}
  openrouter-api-key-free: {{ .Values.closet.openrouter.api_key_free | b64enc | quote }}
  ai-internal-token: {{ .Values.closet.ai.internal_token | b64enc | quote }}
  apns-key: {{ .Values.closet.apns.key | default "" | b64enc | quote }}
  # blank until a key is set → closet-ai falls back to StubWebDetection (off)
  google-vision-api-key: {{ .Values.closet.google_vision.api_key | default "" | b64enc | quote }}
  beta-invite-code: {{ .Values.closet.auth.beta_invite_code | default "" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: gitlab-registry-secret
  namespace: closet
data:
  .dockerconfigjson: {{ .Values.gitlab.registry | quote }}
---
# -- RustFS (S3 replacement for MinIO, which no longer publishes images) --------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-storage
  namespace: closet
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: closet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      securityContext:
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: minio-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: minio-secret-key
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-storage
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: closet
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# Bucket browser on the tailnet
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: closet-storage
  namespace: closet
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - backend:
              service:
                name: rustfs
                port:
                  number: 9001
            path: "/"
            pathType: Prefix
  tls:
    - hosts:
        - closet-storage
---
# -- Server ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: closet-server
  namespace: closet
spec:
  replicas: 1
  # Node runs near CPU capacity; a single replica can't surge, so replace
  # the old pod before creating the new one instead of needing 2x headroom.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: closet-server
  template:
    metadata:
      labels:
        app: closet-server
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: closet-server
          image: registry.gitlab.com/thomvandevin-projects/closet/server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Probe the k8s health groups, not the aggregate /actuator/health:
          # the aggregate includes the mail indicator, and a down SMTP relay
          # must not make the app unready (mail failures surface at send time).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql.db-system.svc.cluster.local:5432/closet
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: CLOSET_AUTH_RPID
              value: closet.thomvandev.in
            - name: CLOSET_AUTH_ALLOWEDORIGINS
              value: https://closet.thomvandev.in
            - name: CLOSET_AUTH_PUBLICURL
              value: https://closet.thomvandev.in
            - name: CLOSET_IOS_TESTFLIGHTURL
              value: https://testflight.apple.com/join/cACnpeqY
            # blank when the secret is empty: no standing invite, only single-use ones
            - name: CLOSET_AUTH_BETAINVITECODE
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: beta-invite-code
            # the tier a new account starts on, while the beta runs on the paid models
            - name: CLOSET_AI_DEFAULTLANE
              value: PAID
            - name: SMTP_HOST
              value: smtp-relay.brevo.com
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: smtp-password
            - name: MAIL_FROM
              value: closet@thomvandev.in
            - name: S3_ENDPOINT
              value: http://rustfs.closet.svc.cluster.local:9000
            - name: S3_BUCKET
              value: closet
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: minio-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: minio-secret-key
            - name: CLOSET_AI_URL
              value: http://closet-ai-svc.closet.svc.cluster.local:8080
            - name: CLOSET_AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: ai-internal-token
            # Spring relaxed binding maps CLOSET_PUSH_KEYID to closet.push.keyId. An
            # underscore before ID would bind closet.push.key.id instead, leaving keyId
            # blank, and PushConfig would silently fall back to logging rather than sending.
            - name: CLOSET_PUSH_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: apns-key
            - name: CLOSET_PUSH_KEYID
              value: "KL9JSM6SGA"
            - name: CLOSET_PUSH_TEAMID
              value: "MX7UH2Z869"
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: closet-server-svc
  namespace: closet
spec:
  selector:
    app: closet-server
  ports:
    - port: 8080
      targetPort: 8080
---
# -- Web (nginx serving the SPA, proxying /api to the server) -------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: closet-web
  namespace: closet
spec:
  replicas: 1
  # See closet-server: replace-then-create to avoid needing surge headroom.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: closet-web
  template:
    metadata:
      labels:
        app: closet-web
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: closet-web
          image: registry.gitlab.com/thomvandevin-projects/closet/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: API_UPSTREAM
              value: http://closet-server-svc.closet.svc.cluster.local:8080
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: closet-web-svc
  namespace: closet
spec:
  selector:
    app: closet-web
  ports:
    - port: 80
      targetPort: 80
---
# -- closet-ai (stateless AI compute; scale to 0 to turn AI features off) -------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: closet-ai
  namespace: closet
spec:
  replicas: 1
  # See closet-server: replace-then-create to avoid needing surge headroom.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: closet-ai
  template:
    metadata:
      labels:
        app: closet-ai
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: closet-ai
          image: registry.gitlab.com/thomvandevin-projects/closet/ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: ai-internal-token
            - name: OPENROUTER_API_KEY_PAID
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: openrouter-api-key-paid
            - name: OPENROUTER_API_KEY_FREE
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: openrouter-api-key-free
            # allow while we learn what the free providers make of garment photos; deny routes
            # Half the price of gemini-3-pro-image and a quarter of the time, at
            # the cost of an occasional cropped leg. Renders are 97% of AI spend
            # and the daily job makes one per user each morning, so this line is
            # what the bill scales on.
            # blank when the secret is empty → reverse image search stays off
            - name: GOOGLE_VISION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: google-vision-api-key
          resources:
            requests:
              cpu: 10m
              memory: 320Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: closet-ai-svc
  namespace: closet
spec:
  selector:
    app: closet-ai
  ports:
    - port: 8080
      targetPort: 8080
