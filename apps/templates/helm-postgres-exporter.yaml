apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    thomvandev.in/placement: workers
  name: postgresql-monitor
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-postgres-exporter
    targetRevision: 8.2.1
    helm:
      valuesObject:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: thomvandev.in/role
                      operator: In
                      values: ["worker"]
        serviceMonitor:
          enabled: true
          namespace: db-system
          labels:
            release: prometheus
        config:
          datasource:
            host: postgresql.db-system.svc.cluster.local
            passwordSecret:
              name: db-secret
              key: password
  destination:
    namespace: db-system
    server: https://kubernetes.default.svc
