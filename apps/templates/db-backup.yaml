# Nightly dumps of every database to the RustFS
# bucket `backups`, one folder per day, kept for 14 days. Each database is a compressed custom-format dump, so one
# database can be restored on its own; the roles go along as plain SQL.
#
# Restore one database into a scratch copy (from any pod with psql and the aws cli, or in two steps):
#   aws --endpoint-url http://rustfs-backups.db-system.svc.cluster.local:9000 s3 cp s3://backups/2026-10-11/pokemon_api.dump /tmp/
#   createdb -h postgresql.db-system.svc.cluster.local -U postgres pokemon_api_restore
#   pg_restore -h postgresql.db-system.svc.cluster.local -U postgres -d pokemon_api_restore --no-owner /tmp/pokemon_api.dump
# Checked on 2026-10-10: pokemon_api restored from the first backup into a scratch database, all 15 tables with the same
# row counts as the live database (cards 21,329, rulings 1,838, card_legality 41,837).
# Since 2026-11-09 the dumps live in rustfs-backups in db-system; older days were copied over from the ptcgl store.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: db-system
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          {{- include "placement.preferWorkers" . | nindent 10 }}
          restartPolicy: Never
          initContainers:
            - name: dump
              image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  export PGHOST=postgresql.db-system.svc.cluster.local PGUSER=postgres
                  day=$(date -u +%F)
                  mkdir -p "/backup/$day"
                  echo "$day" > /backup/DAY
                  pg_dumpall --globals-only > "/backup/$day/roles.sql"
                  for db in $(psql -At -c "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname NOT IN ('postgres') ORDER BY 1"); do
                    pg_dump -Fc -Z 6 "$db" > "/backup/$day/$db.dump"
                    echo "$db: $(du -h "/backup/$day/$db.dump" | cut -f1)"
                  done
{{- if and .Values.db_backup .Values.db_backup.r2_access_key }}
                  # The off-site copy holds only data people made: scraped and downloaded data can be fetched again,
                  # so the tournament archive and scraper_db stay out, and pokemon_api goes without its card, price
                  # and PTCGL rows (keys, requests, aliases, accepts, pins and set codes stay).
                  mkdir -p /backup/offsite
                  cp "/backup/$day/roles.sql" /backup/offsite/
                  for db in pokemon_ai closet pokemon_checkout pokemon_notifications pokemon_portal slowpoke_bingo_db; do
                    cp "/backup/$day/$db.dump" /backup/offsite/ || echo "off-site: no dump for $db"
                  done
                  pg_dump -Fc -Z 6 \
                    --exclude-table-data='public.cards' --exclude-table-data='public.sets' --exclude-table-data='public.set_art' \
                    --exclude-table-data='public.rulings' --exclude-table-data='public.card_legality' \
                    --exclude-table-data='public.cardmarket_prices' --exclude-table-data='public.price_guide' \
                    --exclude-table-data='public.card_data_diffs' --exclude-table-data='public.card_data_unmatched' \
                    --exclude-table-data='public.baked_icons' --exclude-table-data='public.cardmarket_expansions' --exclude-table-data='cardmarket.*' \
                    --exclude-table-data='rainier.cards' --exclude-table-data='rainier.card_attacks' --exclude-table-data='rainier.assets' \
                    --exclude-table-data='rainier.sets' --exclude-table-data='rainier.rarities' --exclude-table-data='tcgdex.*' \
                    pokemon_api > /backup/offsite/pokemon_api.dump
                  echo "off-site: $(du -sh /backup/offsite | cut -f1)"
{{- end }}
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: password
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
{{- if and .Values.db_backup .Values.db_backup.r2_access_key }}
            # Cloudflare R2 bucket, kept under its free 10 GB: R2's own lifecycle rule deletes objects after 14 days,
            # this job removes the 15-day-old folder and refuses to upload once the bucket holds 9 GB.
            - name: offsite
              image: amazon/aws-cli:2.40.2@sha256:acc32af784911165a8e78b63950625d174ba79b800a66a436c974689c87cd755
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  E={{ .Values.db_backup.r2_endpoint | quote }}
                  B={{ .Values.db_backup.r2_bucket | quote }}
                  day=$(cat /backup/DAY)
                  used=$(aws --endpoint-url "$E" s3 ls --recursive --summarize "s3://$B/" | awk '/Total Size/ {print $3}')
                  if [ "${used:-0}" -gt 9000000000 ]; then echo "off-site bucket holds $used bytes, over the 9 GB cap; not uploading"; exit 1; fi
                  aws --endpoint-url "$E" s3 cp --recursive --only-show-errors /backup/offsite "s3://$B/$day/"
                  old=$(date -u -d "$day -15 days" +%F)
                  aws --endpoint-url "$E" s3 rm --recursive --only-show-errors "s3://$B/$old/" || true
                  echo "off-site uploaded $day ($(du -sh /backup/offsite | cut -f1)), bucket held ${used:-0} bytes before"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-r2
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-r2
                      key: secret-key
                - name: AWS_DEFAULT_REGION
                  value: auto
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
{{- end }}
            - name: upload
              image: amazon/aws-cli:2.40.2@sha256:acc32af784911165a8e78b63950625d174ba79b800a66a436c974689c87cd755
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  E=http://rustfs-backups.db-system.svc.cluster.local:9000
                  day=$(cat /backup/DAY)
                  old=$(date -u -d "$day -14 days" +%F)
                  aws --endpoint-url $E s3api head-bucket --bucket backups 2>/dev/null || aws --endpoint-url $E s3api create-bucket --bucket backups
                  aws --endpoint-url $E s3 cp --recursive --only-show-errors "/backup/$day" "s3://backups/$day/"
                  aws --endpoint-url $E s3 rm --recursive --only-show-errors "s3://backups/$old/" || true
                  echo "uploaded $day ($(du -sh /backup/$day | cut -f1)), removed $old"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-s3
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-s3
                      key: secret-key
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 4Gi
---
# The keys of the backups store (db-backup-storage.yaml).
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: db-backup-s3
  namespace: db-system
data:
  access-key: {{ .Values.ptcgl.s3_access_key | b64enc | quote }}
  secret-key: {{ .Values.ptcgl.s3_secret_key | b64enc | quote }}
{{- if and .Values.db_backup .Values.db_backup.r2_access_key }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: db-backup-r2
  namespace: db-system
data:
  access-key: {{ .Values.db_backup.r2_access_key | b64enc | quote }}
  secret-key: {{ .Values.db_backup.r2_secret_key | b64enc | quote }}
{{- end }}
