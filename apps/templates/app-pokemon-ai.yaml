apiVersion: v1
kind: Namespace
metadata:
  name: pokemon-ai
  labels:
    name: pokemon-ai
---
# -- RBAC for GitLab runner deploy step ----------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pokemon-ai-deployer
  namespace: pokemon-ai
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-pokemon-ai-deploy
  namespace: pokemon-ai
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-job
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: pokemon-ai-deployer
  apiGroup: rbac.authorization.k8s.io
---
# -- Secrets ------------------------------------------------------------------
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: api-secret
  namespace: pokemon-ai
data:
  openrouter-api-key: {{ .Values.pokemon_ai.openrouter_api_key | b64enc | quote }}
  pokemon-api-key: {{ .Values.pokemon_ai.pokemon_api_key | b64enc | quote }}
  app-password: {{ .Values.pokemon_ai.app_password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: gitlab-registry-secret
  namespace: pokemon-ai
data:
  .dockerconfigjson: {{ .Values.gitlab.registry | quote }}
---
# -- Chat API (formerly backend) ----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: pokemon-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: chat-api
          image: registry.gitlab.com/thomvandevin-projects/pokemon-ai/chat-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: openrouter-api-key
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: app-password
            - name: POKEMON_API_URL
              value: "http://pokemon-api.pokemon-api.svc.cluster.local:8080"
            - name: POKEMON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: pokemon-api-key
            - name: CHAT_MODEL
              value: anthropic/claude-sonnet-5.5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: pokemon-ai
spec:
  selector:
    app: chat-api
  ports:
    - port: 8080
      targetPort: 8080
---
# -- Chat UI (formerly frontend) ----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  namespace: pokemon-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: chat-ui
          image: registry.gitlab.com/thomvandevin-projects/pokemon-ai/chat-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui
  namespace: pokemon-ai
spec:
  selector:
    app: chat-ui
  ports:
    - port: 80
      targetPort: 80
---
# -- MCP Server ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: pokemon-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: mcp-server
          image: registry.gitlab.com/thomvandevin-projects/pokemon-ai/mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: POKEMON_API_URL
              value: "http://pokemon-api.pokemon-api.svc.cluster.local:8080"
            - name: POKEMON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: pokemon-api-key
            - name: CHAT_API_URL
              value: "http://chat-api.pokemon-ai.svc.cluster.local:8080"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: app-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: pokemon-ai
spec:
  selector:
    app: mcp-server
  ports:
    - port: 3001
      targetPort: 3001
---
# -- Tailscale Ingress (internal only) ----------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokemon-ai
  namespace: pokemon-ai
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - backend:
              service:
                name: chat-ui
                port:
                  number: 80
            path: "/"
            pathType: Prefix
  tls:
    - hosts:
        - pokemon-ai
