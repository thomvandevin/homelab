apiVersion: v1
kind: Namespace
metadata:
  annotations:
    glance/icon: mdi:brain
  name: pokemon-ai
  labels:
    name: pokemon-ai
---
# -- RBAC for GitLab runner deploy step ----------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pokemon-ai-deployer
  namespace: pokemon-ai
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-pokemon-ai-deploy
  namespace: pokemon-ai
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-job
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: pokemon-ai-deployer
  apiGroup: rbac.authorization.k8s.io
---
# -- Secrets ------------------------------------------------------------------
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: api-secret
  namespace: pokemon-ai
data:
  openrouter-api-key: {{ .Values.pokemon_ai.openrouter_api_key | b64enc | quote }}
  pokemon-api-key: {{ .Values.pokemon_ai.pokemon_api_key | b64enc | quote }}
  db-password: {{ .Values.pokemon_ai.db_password | b64enc | quote }}
  owner-password: {{ .Values.pokemon_ai.owner_password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: db-secret
  namespace: pokemon-ai
data:
  password: {{ .Values.db.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: gitlab-registry-secret
  namespace: pokemon-ai
data:
  .dockerconfigjson: {{ .Values.gitlab.registry | quote }}
---
# -- Chat API (formerly backend) ----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: pokemon-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      initContainers:
        - name: create-db
          image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql.db-system.svc.cluster.local -p 5432; do sleep 2; done
              export PGPASSWORD=$DB_ADMIN_PASSWORD
              PG="psql -h postgresql.db-system.svc.cluster.local -U postgres"
              $PG -tc "SELECT 1 FROM pg_database WHERE datname = 'pokemon_ai'" | grep -q 1 || $PG -c "CREATE DATABASE pokemon_ai"
              # chat-api owns its database as a plain role; the database existed before the role, so ownership moves once.
              $PG -v ON_ERROR_STOP=1 <<'SQL'
              \getenv pw APP_DB_PASSWORD
              SELECT 'CREATE ROLE pokemon_ai' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'pokemon_ai')\gexec
              ALTER ROLE pokemon_ai WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'pw';
              ALTER DATABASE pokemon_ai OWNER TO pokemon_ai;
              SQL
              # Objects an earlier version left behind as postgres would block Flyway; hand them to the app role.
              # ($do$ rather than $: Kubernetes turns $ in container args into a single $.)
              $PG -v ON_ERROR_STOP=1 -d pokemon_ai <<'SQL'
              DO $do$ DECLARE r record; BEGIN
                FOR r IN SELECT tablename AS n FROM pg_tables WHERE schemaname = 'public' AND tableowner <> 'pokemon_ai' LOOP
                  EXECUTE format('ALTER TABLE public.%I OWNER TO pokemon_ai', r.n);
                END LOOP;
                FOR r IN SELECT sequencename AS n FROM pg_sequences WHERE schemaname = 'public' AND sequenceowner <> 'pokemon_ai' LOOP
                  EXECUTE format('ALTER SEQUENCE public.%I OWNER TO pokemon_ai', r.n);
                END LOOP;
              END $do$;
              SQL
          env:
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db-password
      containers:
        - name: chat-api
          image: registry.gitlab.com/thomvandevin-projects/pokemon-ai/chat-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: openrouter-api-key
            - name: APP_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: owner-password
            - name: DB_HOST
              value: postgresql.db-system.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pokemon_ai
            - name: DB_USER
              value: pokemon_ai
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db-password
            - name: BUDGET_EUR_PER_USD
              value: "0.92"
            - name: POKEMON_API_URL
              value: "http://pokemon-api.pokemon-api.svc.cluster.local:8080"
            - name: POKEMON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: pokemon-api-key
            - name: CHAT_MODEL
              value: anthropic/claude-sonnet-5.5
          resources:
            requests:
              cpu: 20m
              memory: 320Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: pokemon-ai
spec:
  selector:
    app: chat-api
  ports:
    - port: 8080
      targetPort: 8080
---
# -- Chat UI (formerly frontend) ----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  namespace: pokemon-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: chat-ui
          image: registry.gitlab.com/thomvandevin-projects/pokemon-ai/chat-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui
  namespace: pokemon-ai
spec:
  selector:
    app: chat-ui
  ports:
    - port: 80
      targetPort: 80
---
# -- Tailscale Ingress (internal only) ----------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokemon-ai
  namespace: pokemon-ai
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - backend:
              service:
                name: chat-ui
                port:
                  number: 80
            path: "/"
            pathType: Prefix
  tls:
    - hosts:
        - pokemon-ai
