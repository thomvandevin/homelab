apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    glance/icon: di:home-assistant
  name: home-assistant
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: http://pajikos.github.io/home-assistant-helm-chart
    chart: home-assistant
    targetRevision: 0.3.86
    helm:
      valuesObject:
        service:
          type: LoadBalancer
        ingress:
          enabled: true
          className: tailscale
          hosts:
            - paths:
                - path: /
                  pathType: ImplementationSpecific
          tls:
            - hosts:
                - home-assistant
        configuration:
          enabled: true
          forceInit: true
          # Chart default minus the http block: HTTP/trusted_proxies config is
          # UI-managed (Settings > System > Network) and YAML support is removed in 2027.2.0
          templateConfig: |-
            default_config:

            frontend:
              themes: !include_dir_merge_named themes

            automation: !include automations.yaml
            script: !include scripts.yaml
            scene: !include scenes.yaml
        persistence:
          enabled: true
        hostNetwork: true
        nodeSelector:
          kubernetes.io/hostname: homelab-0
        resources:
          requests:
            cpu: 50m
            memory: 896Mi
          limits:
            memory: 1536Mi
        securityContext:
          privileged: true
        additionalVolumes:
          # BlueZ is driven over the host system bus; without this the bluetooth
          # integration fails with "DBus service not found"
          - name: dbus
            hostPath:
              path: /run/dbus
              type: Directory
        additionalMounts:
          - name: dbus
            mountPath: /run/dbus
            readOnly: true
  destination:
    namespace: home-assistant
    server: https://kubernetes.default.svc
---
# The home-assistant repo's CI publishes its directories as these ConfigMaps;
# Home Assistant mounts them read-only under /config/repo
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-assistant-repo-publisher
  namespace: home-assistant
rules:
  # create cannot be limited by name; only the named ones are mounted
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ha-repo-automations", "ha-repo-scenes", "ha-repo-scripts", "ha-repo-dashboards"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-home-assistant-repo
  namespace: home-assistant
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-job
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: home-assistant-repo-publisher
  apiGroup: rbac.authorization.k8s.io
