apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: http://pajikos.github.io/home-assistant-helm-chart
    chart: home-assistant
    targetRevision: 0.3.79
    helm:
      valuesObject:
        service:
          type: LoadBalancer
        ingress:
          enabled: true
          className: tailscale
          hosts:
            - paths:
                - path: /
                  pathType: ImplementationSpecific
          tls:
            - hosts:
                - home-assistant
        configuration:
          enabled: true
          forceInit: true
          # Chart default minus the http block: HTTP/trusted_proxies config is
          # UI-managed (Settings > System > Network) and YAML support is removed in 2027.2.0
          templateConfig: |-
            default_config:

            frontend:
              themes: !include_dir_merge_named themes

            automation: !include automations.yaml
            script: !include scripts.yaml
            scene: !include scenes.yaml
        persistence:
          enabled: true
        hostNetwork: true
        securityContext:
          privileged: true
        additionalVolumes:
          # BlueZ is driven over the host system bus; without this the bluetooth
          # integration fails with "DBus service not found"
          - name: dbus
            hostPath:
              path: /run/dbus
              type: Directory
        additionalMounts:
          - name: dbus
            mountPath: /run/dbus
            readOnly: true
  destination:
    namespace: home-assistant
    server: https://kubernetes.default.svc
