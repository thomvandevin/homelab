apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.1
    helm:
      valuesObject:
        ingress:
          enabled: true
          host: longhorn
          ingressClassName: tailscale
          tls: true
        metrics:
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: prometheus
        persistence:
          # Three nodes with replica-soft-anti-affinity off: two replicas fit the
          # 256 GB worker disks, three would not
          defaultClassReplicaCount: 2
        preUpgradeChecker:
          # Longhorn's chart recommends disabling this under GitOps: the job runs as a
          # PreSync hook but needs longhorn-service-account, which the same sync creates,
          # so a fresh install deadlocks. upgradeVersionCheck stays on.
          jobEnabled: false
        defaultSettings:
          # Left at the chart default of 0, engines are never upgraded with the manager;
          # volumes had drifted across four engine versions back to v1.9.0
          concurrentAutomaticEngineUpgradePerNodeLimit: 1
          # a pod whose node died is rescheduled instead of staying Terminating
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
