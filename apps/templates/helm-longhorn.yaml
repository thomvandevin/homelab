apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.1
    helm:
      valuesObject:
        ingress:
          enabled: true
          host: longhorn
          ingressClassName: tailscale
          tls: true
        metrics:
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: prometheus
        persistence:
          # Single-node cluster with replica-soft-anti-affinity off, so replicas 2 and 3
          # can never be scheduled and every volume sits permanently degraded
          defaultClassReplicaCount: 1
        defaultSettings:
          # Left at the chart default of 0, engines are never upgraded with the manager;
          # volumes had drifted across four engine versions back to v1.9.0
          concurrentAutomaticEngineUpgradePerNodeLimit: 1
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
