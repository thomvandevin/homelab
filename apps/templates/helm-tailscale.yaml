apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: tailscale-secret
  namespace: tailscale
data:
  clientId: {{ .Values.tailscale.clientId | b64enc | quote }}
  clientSecret: {{ .Values.tailscale.clientSecret | b64enc | quote }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    thomvandev.in/placement: workers
    glance/icon: di:tailscale
  name: tailscale
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.104.2
    helm:
      valuesObject:
        operatorConfig:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: thomvandev.in/role
                        operator: In
                        values: ["worker"]
        oauthSecretVolume:
          secret:
            secretName: tailscale-secret
            items:
              - key: clientId
                path: client_id
              - key: clientSecret
                path: client_secret
        apiServerProxyConfig:
          mode: "true"
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
