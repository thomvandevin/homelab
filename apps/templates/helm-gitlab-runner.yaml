apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: gitlab-runner-secret
  namespace: gitlab-runner
data:
  runner-registration-token: {{ .Values.gitlab.runner_token | b64enc | quote }}
  runner-token: {{ .Values.gitlab.runner_token | b64enc | quote }}
---
# Distribution cache for CI. Reuses the closet MinIO rather than running a second
# object store; the runner keeps its own bucket, separate from the app's data.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: gitlab-runner-cache-secret
  namespace: gitlab-runner
data:
  accesskey: {{ .Values.closet.minio.access_key | b64enc | quote }}
  secretkey: {{ .Values.closet.minio.secret_key | b64enc | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-runner-cache-bucket
  namespace: gitlab-runner
  annotations:
    # The runner never creates the bucket itself, and a plain Job would be immutable
    # across syncs, so run it as a self-deleting hook
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
spec:
  backoffLimit: 3
  # A hook that never terminates leaves the whole app-of-apps sync Running
  # indefinitely; a bad image pull must fail the hook, not hang it
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        # The minio/mc image is not publicly pullable; the AWS CLI speaks S3 to MinIO just as well.
        - name: aws
          image: amazon/aws-cli:2.37.10@sha256:3dacc5db57c923c4223e949795f538ecf1f2212b2b7d5a028b47b97f91564c0d
          command: ["sh", "-c"]
          args:
            - |
              export AWS_ACCESS_KEY_ID="$ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$SECRET_KEY" AWS_DEFAULT_REGION=us-east-1
              endpoint=http://minio-svc.closet.svc.cluster.local:9000
              aws --endpoint-url "$endpoint" s3api head-bucket --bucket gitlab-runner-cache \
                || aws --endpoint-url "$endpoint" s3 mb s3://gitlab-runner-cache
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gitlab-runner-cache-secret
                  key: accesskey
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitlab-runner-cache-secret
                  key: secretkey
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-ci-job
  namespace: gitlab-runner
automountServiceAccountToken: true
---
# Maven global settings mounted into every job; they send requests for Maven Central
# to the in-cluster proxy (app-maven-proxy.yaml). Other repositories a project
# declares are left alone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maven-proxy-settings
  namespace: gitlab-runner
data:
  settings.xml: |
    <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
      <mirrors>
        <mirror>
          <id>homelab-maven-proxy</id>
          <mirrorOf>central</mirrorOf>
          <url>http://maven-proxy.maven-proxy.svc.cluster.local:8080/central</url>
        </mirror>
      </mirrors>
    </settings>
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    glance/icon: di:gitlab
  name: gitlab-runner
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://charts.gitlab.io
    chart: gitlab-runner
    targetRevision: 0.93.0
    helm:
      valuesObject:
        gitlabUrl: https://gitlab.com
        # two workers with twelve threads and 16 GB each; memory requests below
        # keep it to about three jobs per worker
        concurrent: 5
        rbac:
          create: true
        runners:
          secret: gitlab-runner-secret
          tags: "homelab"
          cache:
            secretName: gitlab-runner-cache-secret
          config: |
            [[runners]]
              # Maven 3.9+ reads MAVEN_ARGS on every invocation, so each project picks up the proxy without CI changes
              environment = ["MAVEN_ARGS=--global-settings=/etc/maven-proxy/settings.xml"]
              [runners.kubernetes]
                namespace = "gitlab-runner"
                image = "ubuntu:22.04"
                service_account = "gitlab-ci-job"
                # docker-in-docker for the closet image builds and
                # Testcontainers test jobs (all CI moved off gitlab.com
                # shared runners to stay within compute minutes)
                privileged = true
                # cpu limits stay: unbounded job containers once took a node to a
                # load of 218 on four cores and evicted matter-server
                cpu_request = "250m"
                cpu_limit = "2000m"
                memory_request = "1536Mi"
                memory_limit = "6Gi"
                service_cpu_request = "100m"
                service_cpu_limit = "1000m"
                service_memory_request = "512Mi"
                service_memory_limit = "3Gi"
                helper_cpu_request = "50m"
                helper_cpu_limit = "200m"
                helper_memory_request = "128Mi"
                # a job pod may wait for room rather than fail the job after three minutes
                poll_timeout = 600
                # CI jobs never run on the control plane; a job waits for a worker
                # (poll_timeout) rather than landing next to etcd
                [runners.kubernetes.node_selector]
                  "thomvandev.in/role" = "worker"
                # Docker-in-Docker test jobs saturated the disk of the node running
                # the workspace and stalled its Longhorn volume; prefer the other worker
                [runners.kubernetes.affinity]
                  [runners.kubernetes.affinity.pod_anti_affinity]
                    [[runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution]]
                      weight = 100
                      [runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term]
                        topology_key = "kubernetes.io/hostname"
                        namespaces = ["workspace"]
                        [runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term.label_selector]
                          [[runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term.label_selector.match_expressions]]
                            key = "app"
                            operator = "In"
                            values = ["workspace"]
                [[runners.kubernetes.volumes.config_map]]
                  name = "maven-proxy-settings"
                  mount_path = "/etc/maven-proxy"
              [runners.cache]
                Type = "s3"
                Path = "gitlab-runner"
                Shared = true
                [runners.cache.s3]
                  ServerAddress = "minio-svc.closet.svc.cluster.local:9000"
                  BucketName = "gitlab-runner-cache"
                  BucketLocation = "us-east-1"
                  # in-cluster MinIO speaks plain HTTP
                  Insecure = true
  destination:
    namespace: gitlab-runner
    server: https://kubernetes.default.svc
