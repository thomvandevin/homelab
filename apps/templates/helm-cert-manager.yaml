apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    thomvandev.in/placement: workers
    glance/icon: di:cert-manager
  name: cert-manager
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        cainjector:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: thomvandev.in/role
                        operator: In
                        values: ["worker"]
        webhook:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: thomvandev.in/role
                        operator: In
                        values: ["worker"]
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: thomvandev.in/role
                      operator: In
                      values: ["worker"]
        crds:
          enabled: true
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
