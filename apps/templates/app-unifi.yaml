apiVersion: v1
kind: Namespace
metadata:
  name: unifi
  labels:
    name: unifi
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: unifi-mongo-secret
  namespace: unifi
data:
  mongo-root-password: {{ .Values.unifi.mongo_root_password | b64enc | quote }}
  mongo-password: {{ .Values.unifi.mongo_password | b64enc | quote }}
---
# The controller expects its databases and their owner to already exist; the
# official mongo image only runs this on an empty data directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: unifi-mongo-init
  namespace: unifi
data:
  init-mongo.js: |
    db.getSiblingDB("unifi").createUser({
      user: "unifi",
      pwd: process.env.MONGO_UNIFI_PASSWORD,
      roles: [{ role: "dbOwner", db: "unifi" }]
    });
    db.getSiblingDB("unifi_stat").createUser({
      user: "unifi",
      pwd: process.env.MONGO_UNIFI_PASSWORD,
      roles: [{ role: "dbOwner", db: "unifi_stat" }]
    });
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-db
  namespace: unifi
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-config
  namespace: unifi
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-mongo
  namespace: unifi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi-mongo
  template:
    metadata:
      labels:
        app: unifi-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          args: ["--wiredTigerCacheSizeGB", "0.5"]
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo-secret
                  key: mongo-root-password
            # consumed by init-mongo.js so the password is never written into the ConfigMap
            - name: MONGO_UNIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo-secret
                  key: mongo-password
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: db
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: unifi-db
        - name: init
          configMap:
            name: unifi-mongo-init
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-mongo
  namespace: unifi
spec:
  selector:
    app: unifi-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: unifi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      # Adoption needs the AP's UDP 10001 discovery broadcasts to arrive and the
      # inform URL to be a LAN address the AP can reach, neither of which works
      # from the pod network. ClusterFirstWithHostNet keeps mongo resolvable.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: unifi
          image: lscr.io/linuxserver/unifi-network-application:10.5.67-ls142
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
            - name: MONGO_HOST
              value: unifi-mongo.unifi.svc.cluster.local
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DBNAME
              value: unifi
            - name: MONGO_USER
              value: unifi
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo-secret
                  key: mongo-password
            - name: MEM_LIMIT
              value: "1024"
            - name: MEM_STARTUP
              value: "512"
          ports:
            - { containerPort: 8443, name: https }
            - { containerPort: 8080, name: inform }
            - { containerPort: 3478, protocol: UDP, name: stun }
            - { containerPort: 10001, protocol: UDP, name: discovery }
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: unifi-config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unifi
  namespace: unifi
  annotations:
    # the controller serves its own TLS on 8443 and redirects plain HTTP
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  ingressClassName: tailscale
  rules:
    - host: unifi
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unifi
                port:
                  number: 8443
  tls:
    - hosts:
        - unifi
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: unifi
spec:
  selector:
    app: unifi
  ports:
    - name: https
      port: 8443
      targetPort: 8443
