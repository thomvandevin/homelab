apiVersion: v1
kind: Namespace
metadata:
  annotations:
    glance/icon: mdi:cards
  name: ptcgl
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: ptcgl-secret
  namespace: ptcgl
data:
  s3-access-key: {{ .Values.ptcgl.s3_access_key | b64enc | quote }}
  s3-secret-key: {{ .Values.ptcgl.s3_secret_key | b64enc | quote }}
---
# -- Public images: pokemon-api.thomvandev.in/images/* via the tunnel path rule (/assets is the portal's) --
apiVersion: v1
kind: ConfigMap
metadata:
  name: ptcgl-assets-nginx
  namespace: ptcgl
data:
  default.conf: |
    # RustFS stores the decoded objects without a useful content type.
    map $uri $asset_type {
      ~*\.png$  image/png;
      ~*\.json$ application/json;
      default    application/octet-stream;
    }
    server {
      listen 80;
      server_tokens off;
      location /images/ {
        limit_except GET { deny all; }
        proxy_pass http://rustfs.ptcgl.svc.cluster.local:9000/ptcgl/;
        proxy_set_header Host rustfs.ptcgl.svc.cluster.local:9000;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;
        proxy_hide_header Server;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-request-id;
        # RustFS error bodies name the bucket and key; the public only sees a status.
        proxy_intercept_errors on;
        error_page 403 404 = @missing;
        error_page 500 502 503 504 = @unavailable;
        add_header Content-Type $asset_type;
        add_header Cache-Control "public, max-age=604800";
      }
      location @missing { return 404; }
      location @unavailable { return 502; }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptcgl-assets
  namespace: ptcgl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ptcgl-assets
  template:
    metadata:
      labels:
        app: ptcgl-assets
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: ptcgl-assets-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: ptcgl-assets
  namespace: ptcgl
spec:
  selector:
    app: ptcgl-assets
  ports:
    - port: 80
      targetPort: 80
