apiVersion: v1
kind: Namespace
metadata:
  annotations:
    glance/icon: mdi:cards
  name: ptcgl
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: ptcgl-secret
  namespace: ptcgl
data:
  s3-access-key: {{ .Values.ptcgl.s3_access_key | b64enc | quote }}
  s3-secret-key: {{ .Values.ptcgl.s3_secret_key | b64enc | quote }}
---
# -- RustFS (S3-compatible store for the mirror) -------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: ptcgl
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 35Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: ptcgl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      securityContext:
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ptcgl-secret
                  key: s3-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ptcgl-secret
                  key: s3-secret-key
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: ptcgl
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# Bucket browser on the tailnet
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ptcgl-storage
  namespace: ptcgl
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - backend:
              service:
                name: rustfs
                port:
                  number: 9001
            path: "/"
            pathType: Prefix
  tls:
    - hosts:
        - ptcgl-storage
---
# -- Public images: pokemon-api.thomvandev.in/images/* via the tunnel path rule (/assets is the portal's) --
apiVersion: v1
kind: ConfigMap
metadata:
  name: ptcgl-assets-nginx
  namespace: ptcgl
data:
  default.conf: |
    # RustFS stores the decoded objects without a useful content type.
    map $uri $asset_type {
      ~*\.png$  image/png;
      ~*\.json$ application/json;
      default    application/octet-stream;
    }
    server {
      listen 80;
      server_tokens off;
      location /images/ {
        limit_except GET { deny all; }
        proxy_pass http://rustfs.ptcgl.svc.cluster.local:9000/ptcgl/;
        proxy_set_header Host rustfs.ptcgl.svc.cluster.local:9000;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;
        proxy_hide_header Server;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-request-id;
        # RustFS error bodies name the bucket and key; the public only sees a status.
        proxy_intercept_errors on;
        error_page 403 404 = @missing;
        error_page 500 502 503 504 = @unavailable;
        add_header Content-Type $asset_type;
        add_header Cache-Control "public, max-age=604800";
      }
      location @missing { return 404; }
      location @unavailable { return 502; }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptcgl-assets
  namespace: ptcgl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ptcgl-assets
  template:
    metadata:
      labels:
        app: ptcgl-assets
    spec:
      {{- include "placement.preferWorkers" . | nindent 6 }}
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: ptcgl-assets-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: ptcgl-assets
  namespace: ptcgl
spec:
  selector:
    app: ptcgl-assets
  ports:
    - port: 80
      targetPort: 80
