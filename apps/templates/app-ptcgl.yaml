apiVersion: v1
kind: Namespace
metadata:
  annotations:
    glance/icon: mdi:cards
  name: ptcgl
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: ptcgl-secret
  namespace: ptcgl
data:
  s3-access-key: {{ .Values.ptcgl.s3_access_key | b64enc | quote }}
  s3-secret-key: {{ .Values.ptcgl.s3_secret_key | b64enc | quote }}
